name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ⛔ NOTHING HERE HAD EVER ASKED. Scanned by hand on 2026-10-18, with the
  # toolchain the `go` directive then permitted -- go1.27.1 -- this module had
  # 22 findings, EIGHT of them reachable:
  #
  #   GO-2026-6607 stdlib.Read       GO-2026-6603 stdlib.RoundTrip
  #   GO-2026-6617 stdlib.RoundTrip  GO-2026-6608 stdlib.ReadMIMEHeader
  #   GO-2026-6613 stdlib.Do         GO-2026-6611 stdlib.Read
  #   GO-2026-6610 stdlib.RoundTrip  GO-2026-6605 stdlib.Do
  #
  # Reachable, not merely present: pkgm installs packages over HTTP, so those
  # are its own paths.
  #
  # ⛔ AND THE `go` DIRECTIVE IS THE TOOLCHAIN. The lane always pinned
  # go-version 1.27.2, so what CI built was never vulnerable -- but `go
  # install github.com/go-pkgx/pkgm@main`, which is how every factory
  # workflow in go-pkgx/packages gets this binary, builds with the RUNNER's
  # toolchain. Raising the directive alone took this module from 22 findings
  # to 1, a notice with no released fix.
  vuln:
    name: govulncheck, judged by vulngate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      # ⛔ NO `set -o pipefail` and no bare exit status: govulncheck exits
      # non-zero over findings it has decided are NOT called, and zero over
      # some it has, which is the whole reason vulngate exists. The emptiness
      # check is the other half -- a scan that wrote nothing must not read as
      # nothing found. Scanner @latest, judge pinned: the scanner should know
      # about an advisory published this morning, the verdict should not
      # change under the repository without a commit.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.23.0
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > "$RUNNER_TEMP/vuln.json" || true
          test -s "$RUNNER_TEMP/vuln.json" || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" "$RUNNER_TEMP/vuln.json"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go vet ./...
      - run: go test -race -coverprofile=cov.out ./...
      - run: go tool cover -func=cov.out | tail -1

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          # The qemu lanes vary the ARCHITECTURE and hold the OS fixed. The BSDs
          # are the other dimension: same amd64, a different kernel and libc.
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: loong64
          # s390x is BIG-ENDIAN, and nothing else in this matrix is.
          - goos: linux
            goarch: s390x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      # A CGO_ENABLED=0 build must be fully static on every 64-bit target,
      # so pkgm can ship on a `FROM scratch` image for each arch.
      - env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags='-s -w' -o pkgm-${{ matrix.goos }}-${{ matrix.goarch }} .

  emulated:
    name: test (${{ matrix.goarch }}, qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            qemu: qemu-aarch64-static
          - goarch: riscv64
            qemu: qemu-riscv64-static
          - goarch: ppc64le
            qemu: qemu-ppc64le-static
          - goarch: s390x
            qemu: qemu-s390x-static
          - goarch: loong64
            qemu: qemu-loongarch64-static
    # Cross-COMPILING proves the code builds for an architecture. It says
    # nothing about whether it WORKS there, and the bugs a compiler cannot see
    # are exactly the interesting ones: a byte order read from the host rather
    # than from the format, an assumption about int width, a struct laid out
    # differently.
    #
    # s390x is here because it is BIG-ENDIAN and nothing else we run is.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user qemu-user-binfmt
          # Named, not assumed: a missing emulator must report itself as a
          # missing tool rather than as a failure on that architecture.
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})" >&2
            exit 1
          fi
          # The resolved name crosses to the `go test` step, which prints it:
          # without that line, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "QEMU_EXEC=$q" >> "$GITHUB_ENV"
      - name: go test
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        # -count=1 so a cached PASS from the host architecture cannot stand in
        # for a run that never happened under emulation.
        run: |
          # Printed on purpose: without it, "ran under emulation" and "skipped"
          # are indistinguishable from a green tick. The install step resolved
          # the name and failed the lane if neither binary was there.
          echo "running ${{ matrix.goarch }} under $QEMU_EXEC"
          go test -count=1 -exec "$QEMU_EXEC" ./...

  freebsd:
    name: test (FreeBSD, a kernel that is not Linux)
    runs-on: ubuntu-latest
    # Cross-compiling proves the code builds for an OS. It says nothing about
    # whether it WORKS there, and the bugs a compiler cannot see are the
    # interesting ones: a path convention, a syscall that behaves differently,
    # an assumption that /proc is mounted.
    #
    # The toolchain never enters the VM — go.mod names a Go version no BSD
    # package set carries, and a lane that installed one would depend on what a
    # package mirror happens to hold that day. Same idiom as the qemu lanes:
    # build here, run there, the VM supplying only a kernel and a libc.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build freebsd
      # Pinned by commit, not by tag: a tag can be moved onto code we never read.
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  netbsd:
    name: test (NetBSD, a kernel that is not Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build netbsd
      - uses: vmactions/netbsd-vm@7f23a491dcc69c34195721ab67934917707f84c7
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  openbsd:
    name: test (OpenBSD, the strictest kernel we can reach)
    runs-on: ubuntu-latest
    # OpenBSD is the one most likely to find something: W^X is enforced, malloc
    # is deliberately hostile (junk-filling, guard pages), and syscall origin is
    # policed. Code that merely happens to work elsewhere tends to stop here.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build openbsd
      - uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run
